services:
  - type: web
    name: projectv2-api
    runtime: python
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: GEOSERVER_ENABLED
        value: "false"

  - type: web
    name: projectv2-frontend
    runtime: static
    rootDir: frontend
    buildCommand: echo "No frontend build step"
    staticPublishPath: .
